name: ci

# Lint and test the engine workspace (Horizon + our pvp-* crates) and the launcher workspace.
# Linux runs on every push; Windows and macOS (pricier minutes on a private repository) only on main and on
# pull requests.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test runs never reach Horizon's telemetry server.
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_NO_AUDIO: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - id: os
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # The engine workspace: formatting, clippy -D warnings on every crate and target, then the tests.
  engine:
    name: engine (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev mold
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          shared-key: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy (workspace, all targets)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (game, platform-specific code)
        if: runner.os != 'Linux'
        run: cargo clippy --locked -p horizon-game -- -D warnings
      - name: Tests (libraries, binaries, integration tests; examples and doc tests excluded as in pr_ready)
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked --lib --bins --tests
      - name: Disk usage
        if: always()
        run: df -h . || true

  launcher:
    name: launcher (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Space-separated crates of ours in the launcher workspace, checked strictly (none yet: phase 4).
      LAUNCHER_OWN_CRATES: ""
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential cmake pkg-config clang \
            libfontconfig-dev libfreetype-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # OneLauncher's own code is neither rustfmt-clean with the current stable rustfmt nor clippy -D warnings clean
      # upstream; reformatting it would make every subtree pull conflict. Strict checks apply to the crates we add
      # (LAUNCHER_OWN_CRATES); upstream code gets clippy (warnings reported, not fatal) and its tests.
      - name: Format (our crates)
        if: runner.os == 'Linux' && env.LAUNCHER_OWN_CRATES != ''
        run: for c in $LAUNCHER_OWN_CRATES; do cargo fmt -p "$c" --check; done
      - name: Clippy (our crates, -D warnings)
        if: env.LAUNCHER_OWN_CRATES != ''
        run: cargo clippy --locked --all-targets $(printf -- '-p %s ' $LAUNCHER_OWN_CRATES) -- -D warnings
      - name: Clippy (upstream code, report only)
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked
