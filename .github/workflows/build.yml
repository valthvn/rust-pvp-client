name: build

# Release binaries of the game client and the launcher for every supported platform, published as workflow
# artifacts. Runs on main and on demand (release builds are long: thin LTO, one codegen unit).
# Nothing from Mojang is built in or uploaded: the client prepares its resources from the player's own install.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  client:
    name: client (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: "" }
          - { name: windows-x64, os: windows-latest, exe: ".exe" }
          - { name: macos-arm64, os: macos-latest, exe: "" }
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          shared-key: engine-release
          cache-on-failure: true
      - name: Build (game, preparer, control tool)
        # The release flags (game-build.yml sets its own RUSTFLAGS, so the parallel front end of .cargo/config.toml
        # is not used for release builds either).
        env:
          RUSTFLAGS: ""
        run: |
          # pvp-client replaces horizon-official once it exists (phase 1).
          bin=horizon-official
          if cargo metadata --no-deps --format-version 1 | grep -q '"name":"pvp-client"'; then bin=pvp-client; fi
          echo "BIN=$bin" >> "$GITHUB_ENV"
          cargo build --release --locked -p "$bin" -p horizon-prepare -p horizon-client-lib --bin "$bin" --bin horizon-prepare --bin horizon-ctl
      - name: Stage
        run: |
          mkdir -p ../dist
          cp "target/release/$BIN${{ matrix.exe }}" "../dist/pvp-client${{ matrix.exe }}"
          cp "target/release/horizon-prepare${{ matrix.exe }}" ../dist/
          cp "target/release/horizon-ctl${{ matrix.exe }}" ../dist/
          cp research-lock.json ../dist/
          cp ../LICENSE ../ATTRIBUTION.md ../dist/
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.name }}
          path: dist/
          retention-days: 3

  launcher:
    name: launcher (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: "" }
          - { name: windows-x64, os: windows-latest, exe: ".exe" }
          - { name: macos-arm64, os: macos-latest, exe: "" }
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential cmake pkg-config clang \
            libfontconfig-dev libfreetype-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target
          shared-key: launcher-release
          cache-on-failure: true
      - name: Build
        run: cargo build --release --locked --bin oneclient_app
      - name: Stage
        run: |
          mkdir -p ../dist
          cp "target/release/oneclient_app${{ matrix.exe }}" ../dist/
          cp ../LICENSE ../ATTRIBUTION.md ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: dist/
          retention-days: 3
